<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>ISO 22000 — Certificate</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@700;800&family=Archivo:wght@400;500;600&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../css/certs.css">

<body>
  <div class="bar">
    <a class="back" href="../index.html#certifications">← Back to portfolio</a>
    <span class="tag">Certificate</span>
  </div>
  <main>
    <div class="head">
      <div>
        <div class="kicker">Food safety</div>
        <h1>ISO 22000:2018</h1>
        <div class="issuer">Annelie Coetzee Consultants</div>
      </div>
      <a class="dl" href="../assets/certs/iso-22000.pdf" download>Download PDF ↓</a>

    <div class="frame">

      <div class="placeholder" style="display:none;">
        <div class="icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="8.5"/><path d="M8.3 12.2l2.4 2.4 5-5"/></svg></div>
        <h2>Certificate not added yet</h2>
        <p>Save the certificate image as <code>assets/certs/iso-22000.png</code> and it will display here automatically.</p>
      </div>
    </div>
